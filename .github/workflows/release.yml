name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Work out the version and whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          else
            VERSION="$(sed -n "s/.*versionName *= *'\([^']*\)'.*/\1/p" app/build.gradle)"
            # On main, publish automatically when this version has no release yet.
            if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              RELEASE=true
            else
              RELEASE=false
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, publish release: $RELEASE"

      - name: Verify signature and name the APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JellyBuddy-${{ steps.version.outputs.version }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: JellyBuddy-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jelly Buddy ${{ steps.version.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Install
            Download the APK below on your Android phone (Android 8.0+), open it, and allow installing from your browser if asked.

            Tilt to slosh him around · tap to jump · spin the phone to make him dizzy · shake for chaos.

            Signed with the repo's public test key, so later releases install over this one. Not for Play Store distribution.
